[project]
name = "metadata-api"
version = "3.4.0.dev"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Språkbanken Text", email = "sb-info@svenska.gu.se" }
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "gitpython>=3.1.59",
    "jsonschema-rs>=0.49.9",
    "lxml>=6.1.1",
    "markdown>=3.10.3",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.15.0",
    "pymemcache>=4.0.0",
    "pyyaml>=6.0.3",
    "redis~=6.0.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
output-format = "grouped"

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "missing-trailing-period",   # pydocstyle
    "non-imperative-mood",   # pydocstyle
    "E",      # pycodestyle: errors
    "F",      # Pyflakes
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle: warnings
]
ignore = [
    "any-type",  # flake8-annotations
    "function-call-in-default-argument",  # flake8-bugbear
    "missing-trailing-comma",  # flake8-commas
    "ambiguous-variable-name",  # pycodestyle
    "PLR09",  # Pylint: too-many-*
    "too-many-nested-blocks",  # Pylint
    "suppressible-exception",  # flake8-simplify
]

preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "metadata_api"
module-root = ""

[tool.pyright]
typeCheckingMode = "standard"
include = [
    "metadata_api/**/*.py",
    "batch_jobs/**/*.py",
    "gen_pids/**/*.py",
    "tests/**/*.py",
]
